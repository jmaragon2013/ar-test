<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunarie AR Demo</title>
    <!-- Added A-Frame and AR.js libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #ECDFEE;
            gap: 48px;
            position: relative;
            z-index: 1000;
        }

        #splash-screen.hidden {
            display: none;
        }

        #logo {
            max-width: 400px;
            width: 80%;
            height: auto;
        }

        #start-button {
            background-color: #312731;
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        #start-button:hover {
            transform: scale(1.05);
        }

        #start-button:active {
            transform: scale(0.95);
        }

        /* Updated AR scene styles */
        #ar-scene {
            display: none;
            width: 100vw;
            height: 100vh;
        }

        #ar-scene.active {
            display: block;
        }

        /* Added instructions overlay */
        #instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(49, 39, 49, 0.9);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            text-align: center;
            z-index: 999;
            max-width: 90%;
            font-size: 14px;
            display: none;
        }

        #instructions.show {
            display: block;
        }

        /* Added download marker button */
        #download-marker {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ECDFEE;
            color: #312731;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            z-index: 999;
            display: none;
            text-decoration: none;
            font-size: 14px;
        }

        #download-marker.show {
            display: block;
        }

        #error-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(49, 39, 49, 0.95);
            color: white;
            padding: 24px 32px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            z-index: 1001;
        }

        #error-message.show {
            display: block;
        }

        #error-message button {
            margin-top: 16px;
            background-color: #ECDFEE;
            color: #312731;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Hide A-Frame UI elements */
        .a-loader-title {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img id="logo" src="logolunarie.png" alt="Lunarie Logo">
        <button id="start-button">Iniciar AR</button>
    </div>

    <!-- Replaced camera container with AR.js scene -->
    <a-scene
        id="ar-scene"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
    >
        <!-- Camera -->
        <a-entity camera></a-entity>

        <!-- Hiro Marker with Flowers -->
        <a-marker preset="hiro" id="hiro-marker">
            <!-- Flowers image as AR content, 25% smaller (scale 0.75) -->
            <a-image 
                src="flores.jpg" 
                rotation="-90 0 0" 
                scale="2 2 2"
                position="0 0.1 0"
                opacity="1"
            ></a-image>
        </a-marker>
    </a-scene>

    <!-- Added instructions overlay -->
    <div id="instructions">
        Apunta la cámara al marcador Hiro para ver las flores
    </div>

    <!-- Added download marker button -->
    <a id="download-marker" href="hiro-marker.jpg" download="hiro-marker.jpg">
        Descargar Marcador Hiro
    </a>

    <!-- Error Message -->
    <div id="error-message">
        <p id="error-text"></p>
        <button id="retry-button">Reintentar</button>
    </div>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const arScene = document.getElementById('ar-scene');
        const startButton = document.getElementById('start-button');
        const instructions = document.getElementById('instructions');
        const downloadMarker = document.getElementById('download-marker');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const retryButton = document.getElementById('retry-button');

        function startAR() {
            try {
                console.log('[v0] Starting AR...');
                splashScreen.classList.add('hidden');
                arScene.classList.add('active');
                instructions.classList.add('show');
                downloadMarker.classList.add('show');
                
                const marker = document.querySelector('#hiro-marker');
                
                marker.addEventListener('markerFound', () => {
                    console.log('[v0] Marker detected!');
                    instructions.textContent = '¡Marcador detectado! Las flores deberían aparecer';
                    instructions.style.backgroundColor = 'rgba(76, 175, 80, 0.9)';
                });
                
                marker.addEventListener('markerLost', () => {
                    console.log('[v0] Marker lost');
                    instructions.textContent = 'Apunta la cámara al marcador Hiro para ver las flores';
                    instructions.style.backgroundColor = 'rgba(49, 39, 49, 0.9)';
                });
                
            } catch (error) {
                console.error('[v0] Error starting AR:', error);
                showError('Error al iniciar AR: ' + error.message);
            }
        }

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        startButton.addEventListener('click', () => {
            hideError();
            startAR();
        });

        retryButton.addEventListener('click', () => {
            hideError();
            arScene.classList.remove('active');
            instructions.classList.remove('show');
            downloadMarker.classList.remove('show');
            splashScreen.classList.remove('hidden');
        });

        arScene.addEventListener('loaded', () => {
            console.log('[v0] AR scene loaded successfully');
        });
    </script>
</body>
</html>
